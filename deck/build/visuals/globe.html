<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Noto Sans"; font-weight: 400; src: url(/fonts/noto-sans-latin-400-normal.woff2); }
  @font-face { font-family: "Noto Sans"; font-weight: 600; src: url(/fonts/noto-sans-latin-600-normal.woff2); }
  @font-face { font-family: "Noto Sans"; font-weight: 700; src: url(/fonts/noto-sans-latin-700-normal.woff2); }
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; width: 2400px; height: 2400px; }
  #stage canvas { position: absolute; inset: 0; }
  .lbl { position: absolute; font-family: "Noto Sans"; color: #F4F8FB; white-space: nowrap; transform: translate(0, -50%);
          background: rgba(7,18,31,0.78); padding: calc(14px * var(--ls, 1)) calc(22px * var(--ls, 1)) calc(16px * var(--ls, 1)); border-radius: calc(14px * var(--ls, 1)); }
  .lbl b { display: block; font-weight: 700; font-size: calc(46px * var(--ls, 1)); letter-spacing: 0.02em; }
  .lbl span { display: block; font-weight: 400; font-size: calc(32px * var(--ls, 1)); color: #A9C7DA; margin-top: 4px; }
</style>
<script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
<script src="/lib/d3-array.min.js"></script>
<script src="/lib/d3-geo.min.js"></script>
<script src="/lib/topojson-client.min.js"></script>
</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from 'three';

// Visual config comes from the query string so one page can render several framings.
const q = new URLSearchParams(location.search);
const VIEW_LAT = +(q.get('lat') ?? -24), VIEW_LON = +(q.get('lon') ?? 62);
const LS = +(q.get('ls') ?? 1); // label scale: raise when the image is placed small on a slide
document.documentElement.style.setProperty('--ls', LS);
const S = 2400;

// Polar palette (deck/design/MASTER.md)
const C = {
  ocean: '#0C2740', oceanDeep: '#081C30', land: '#A9C1D3', ice: '#F4F8FB',
  grid: 'rgba(127,200,230,0.10)', saffron: '#E89C30', atmos: new THREE.Color('#5FB8D6'),
};

const land = await (await fetch('/data/land-50m.json')).json();
const landGeo = topojson.feature(land, land.objects.land);

// 1. Equirectangular texture: ocean, graticule, land, Antarctica brightened as ice.
const TW = 8192, TH = 4096;
const tex = document.createElement('canvas'); tex.width = TW; tex.height = TH;
const g = tex.getContext('2d');
const proj = d3.geoEquirectangular().scale(TW / (2 * Math.PI)).translate([TW / 2, TH / 2]);
const path = d3.geoPath(proj, g);
const grad = g.createLinearGradient(0, 0, 0, TH);
grad.addColorStop(0, C.oceanDeep); grad.addColorStop(0.5, C.ocean); grad.addColorStop(1, C.oceanDeep);
g.fillStyle = grad; g.fillRect(0, 0, TW, TH);
g.beginPath(); path(d3.geoGraticule10()); g.strokeStyle = C.grid; g.lineWidth = 3; g.stroke();
g.beginPath(); path(landGeo); g.fillStyle = C.land; g.fill();
// Antarctica: everything south of 60°S that is land, redrawn in pure ice white.
g.save(); g.beginPath(); g.rect(0, proj([0, -60])[1], TW, TH); g.clip();
g.beginPath(); path(landGeo); g.fillStyle = C.ice; g.fill(); g.restore();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);

// lat/lon → point on unit sphere, matching SphereGeometry's UV layout.
const v3 = (lat, lon, r = 1) => {
  const a = THREE.MathUtils.degToRad(lat), b = THREE.MathUtils.degToRad(lon);
  return new THREE.Vector3(Math.cos(a) * Math.cos(b) * r, Math.sin(a) * r, -Math.cos(a) * Math.sin(b) * r);
};

const texture = new THREE.CanvasTexture(tex);
texture.colorSpace = THREE.SRGBColorSpace; texture.anisotropy = 8;
const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 192),
  new THREE.MeshStandardMaterial({ map: texture, roughness: 0.95, metalness: 0 }));
scene.add(earth);

// Atmosphere: outer halo (back-faced shell, fades to 0 at its silhouette) + thin limb glow on the disk.
const R_HALO = 1.16, LIMB = Math.sqrt(1 - 1 / (R_HALO * R_HALO));
const vs = `varying vec3 n; varying vec3 v; void main(){ n = normalize(normalMatrix*normal);
  vec4 mv = modelViewMatrix*vec4(position,1.); v = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`;
scene.add(new THREE.Mesh(new THREE.SphereGeometry(R_HALO, 128, 128), new THREE.ShaderMaterial({
  uniforms: { c: { value: C.atmos }, limb: { value: LIMB } }, vertexShader: vs,
  fragmentShader: `uniform vec3 c; uniform float limb; varying vec3 n; varying vec3 v; void main(){
    float i = pow(clamp(-dot(n, v) / limb, 0., 1.), 3.0); gl_FragColor = vec4(c, i * 0.55); }`,
  side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
})));
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.003, 128, 128), new THREE.ShaderMaterial({
  uniforms: { c: { value: C.atmos } }, vertexShader: vs,
  fragmentShader: `uniform vec3 c; varying vec3 n; varying vec3 v; void main(){
    float i = pow(1. - max(dot(n, v), 0.), 4.0); gl_FragColor = vec4(c, i * 0.7); }`,
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
})));

// Camera over the Indian Ocean so India and the Antarctic stations share one hemisphere.
const eye = v3(VIEW_LAT, VIEW_LON, 6.0); // far enough that the halo (r=1.16) fades out inside the frame
camera.position.copy(eye); camera.up.set(0, 1, 0); camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.copy(v3(VIEW_LAT + 25, VIEW_LON - 40, 6)); scene.add(sun);

// Places. Coordinates: Maitri & Bharati from NCPOR met-data portal; Goa = NCPOR HQ.
const places = [
  { id: 'goa', name: 'NCPOR, Goa', sub: 'Headquarters', lat: 15.40, lon: 73.83, dx: 96 },
  { id: 'maitri', name: 'Maitri', sub: '70.75°S · 11.72°E', lat: -70.750, lon: 11.717, dx: -96, left: true },
  { id: 'bharati', name: 'Bharati', sub: '69.41°S · 76.20°E', lat: -69.407, lon: 76.195, dx: 96 },
];

// Expedition routes: great-circle arcs lifted off the surface.
const arc = (a, b, lift = 0.16) => {
  const A = v3(a.lat, a.lon), B = v3(b.lat, b.lon), pts = [];
  for (let i = 0; i <= 160; i++) {
    const t = i / 160, p = A.clone().lerp(B, t).normalize();
    pts.push(p.multiplyScalar(1 + Math.sin(Math.PI * t) * lift));
  }
  return new THREE.CatmullRomCurve3(pts);
};
const routeMat = new THREE.MeshBasicMaterial({ color: C.saffron, transparent: true, opacity: 0.9 });
for (const to of ['maitri', 'bharati']) {
  const curve = arc(places[0], places.find(p => p.id === to));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 200, 0.0055, 12, false), routeMat));
}

// Station markers: solid core + soft halo.
const haloTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const r = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, 'rgba(232,156,48,0.95)'); r.addColorStop(0.25, 'rgba(232,156,48,0.45)'); r.addColorStop(1, 'rgba(232,156,48,0)');
  x.fillStyle = r; x.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
})();
for (const p of places) {
  const pos = v3(p.lat, p.lon, 1.004);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.016, 24, 24), new THREE.MeshBasicMaterial({ color: '#FFD9A0' }));
  core.position.copy(pos); scene.add(core);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.position.copy(pos); halo.scale.setScalar(0.13); scene.add(halo);
}

renderer.render(scene, camera);

// Labels as DOM (crisp type), placed at each marker's screen position.
for (const p of places) {
  const s = v3(p.lat, p.lon, 1.004).project(camera);
  const el = document.createElement('div'); el.className = 'lbl';
  el.style.left = ((s.x + 1) / 2 * S + p.dx) + 'px'; el.style.top = ((1 - s.y) / 2 * S) + 'px';
  el.innerHTML = `<b>${p.name}</b><span>${p.sub}</span>`;
  if (p.left) { el.style.transform = 'translate(-100%, -50%)'; el.style.textAlign = 'right'; }
  document.getElementById('stage').appendChild(el);
}
await document.fonts.ready;
window.__done = true;
</script>
</body>
</html>
